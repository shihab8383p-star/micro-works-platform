name: Auto Screenshot & Post (24/7 with Images!)

# Takes screenshots of your website automatically and posts to social media
# Runs on GitHub's FREE cloud servers

on:
  schedule:
    # Run twice per day (every 12 hours)
    - cron: '0 */12 * * *'  # At 00:00 and 12:00 UTC
  workflow_dispatch: # Can also run manually

jobs:
  screenshot-and-post:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      
      - name: Install screenshot tool
        run: |
          echo "📸 Installing screenshot tool..."
          npm install -g puppeteer
          
      - name: Take website screenshot
        run: |
          echo "📸 Taking screenshot of your website..."
          echo "URL: https://micro-works-platform-1.onrender.com"
          # This would take actual screenshot with puppeteer
          
      - name: Add text overlay
        run: |
          echo "✍️ Adding text overlay to image..."
          echo "Text: Earn $500+ Per Month Online"
          # This would use ImageMagick to add text
          
      - name: Post to Twitter with image
        run: |
          echo "🐦 Posting to Twitter with screenshot..."
          echo "Image: website-screenshot.png"
          echo "Tweet: Just earned $50 today! Check out this legit platform 💰"
          
      - name: Post to Reddit with image
        run: |
          echo "📝 Posting to Reddit with screenshot..."
          echo "Subreddit: r/beermoney"
          
      - name: Log success
        run: |
          echo "✅ Screenshot posted at $(date)"
          echo "Next run in 12 hours"

# NOTE: To make this actually work, add:
# 1. Twitter API keys (Settings > Secrets)
# 2. Reddit API keys (Settings > Secrets)
# 
# This is just the framework - ready to be activated!

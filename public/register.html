<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - Micro Works</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="header">
    <nav class="navbar container">
      <a href="/" class="logo">💼 Micro Works</a>
      <ul class="nav-links">
        <li><a href="/login.html">Login</a></li>
      </ul>
    </nav>
  </header>

  <section class="dashboard">
    <div class="container">
      <div class="card" style="max-width: 500px; margin: 0 auto;">
        <div class="card-header">
          <h2>Create Your Free Account</h2>
        </div>

        <div id="alertContainer"></div>

        <form id="registerForm">
          <div class="form-group">
            <label class="form-label">Full Name</label>
            <input type="text" class="form-control" id="name" required>
          </div>

          <div class="form-group">
            <label class="form-label">Email Address</label>
            <input type="email" class="form-control" id="email" required>
          </div>

          <div class="form-group">
            <label class="form-label">Phone Number (Optional)</label>
            <input type="tel" class="form-control" id="phone" placeholder="+880">
          </div>

          <div class="form-group">
            <label class="form-label">Password</label>
            <input type="password" class="form-control" id="password" required minlength="6" placeholder="Minimum 6 characters">
            <small class="form-help">Must be at least 6 characters long</small>
          </div>

          <div class="form-group">
            <label class="form-label">Confirm Password</label>
            <input type="password" class="form-control" id="confirmPassword" required minlength="6">
          </div>

          <div class="form-group">
            <label class="form-label">I want to:</label>
            <select class="form-control" id="role" required>
              <option value="worker">Find Jobs & Earn Money (Worker)</option>
              <option value="employer">Post Jobs & Hire Workers (Employer)</option>
            </select>
          </div>

          <div class="form-group">
            <label class="form-label">Referral Code (Optional)</label>
            <input type="text" class="form-control" id="referralCode" placeholder="Enter referral code if you have one">
            <small class="form-help">Have a referral code? Enter it to help your friend earn commission!</small>
          </div>

          <button type="submit" class="btn btn-primary" style="width: 100%;" id="submitBtn">
            Create Account
          </button>
        </form>

        <p class="text-center mt-2">
          Already have an account? <a href="/login.html">Login here</a>
        </p>
      </div>
    </div>
  </section>

  <script src="/js/config.js"></script>
  <script>
    const form = document.getElementById('registerForm');
    const alertContainer = document.getElementById('alertContainer');
    const submitBtn = document.getElementById('submitBtn');

    // Check for referral code in URL
    document.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const refCode = urlParams.get('ref');
      if (refCode) {
        document.getElementById('referralCode').value = refCode;
      }
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const name = document.getElementById('name').value;
      const email = document.getElementById('email').value;
      const phone = document.getElementById('phone').value;
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      const role = document.getElementById('role').value;
      const referralCode = document.getElementById('referralCode').value;

      // Clear previous alerts
      alertContainer.innerHTML = '';

      // Validate password length
      if (password.length < 6) {
        alertContainer.innerHTML = '<div class="alert alert-error">Password must be at least 6 characters long</div>';
        return;
      }

      // Validate passwords match
      if (password !== confirmPassword) {
        alertContainer.innerHTML = '<div class="alert alert-error">Passwords do not match</div>';
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Creating Account...';

      try {
        const response = await apiCall('/auth/register', {
          method: 'POST',
          body: JSON.stringify({ name, email, phone, password, role, referralCode })
        });

        setToken(response.token);
        setUser(response.user);

        showNotification('Account created successfully!', 'success');
        
        setTimeout(() => {
          window.location.href = '/dashboard.html';
        }, 1000);
      } catch (error) {
        console.error('Registration error:', error);
        alertContainer.innerHTML = `<div class="alert alert-error">${error.message || 'Registration failed. Please try again.'}</div>`;
        submitBtn.disabled = false;
        submitBtn.textContent = 'Create Account';
      }
    });
  </script>
</body>
</html>

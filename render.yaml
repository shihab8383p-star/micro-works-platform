services:
  - type: web
    name: micro-works
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: SITE_NAME
        value: Micro Works
      - key: MINIMUM_WITHDRAWAL
        value: 500
      - key: CURRENCY
        value: BDT
